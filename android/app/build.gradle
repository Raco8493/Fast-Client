plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phonecraft.host'
    compileSdk 35

    defaultConfig {
        applicationId 'com.phonecraft.host'
        minSdk 26
        targetSdk 33
        versionCode 5
        versionName '1.4.0-beta'
    }

    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/libhostphone_java.so' } }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
