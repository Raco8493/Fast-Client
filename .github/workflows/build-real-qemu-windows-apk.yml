name: Build Real Windows QEMU Android APK
on:
  push:
    branches: [windows10-android-qemu-vm]
    paths:
      - 'Windows10-QEMU-Android/**'
      - '.github/workflows/build-real-qemu-windows-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile APK
        run: gradle -p Windows10-QEMU-Android --no-daemon assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Windows10-QEMU-Android-debug-APK
          path: Windows10-QEMU-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
