name: Build Windows 10 Android Simulator APK

on:
  push:
    branches: [windows10-android-simulator]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout simulator branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract project sources
        run: unzip -q Windows10Simulator/Win10-Android-Simulator-source.zip
      - name: Build debug APK
        run: gradle -p Win10-Android-Simulator --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Windows10-Android-Simulator-debug-APK
          path: Win10-Android-Simulator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
