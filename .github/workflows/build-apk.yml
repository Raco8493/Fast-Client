name: Build PhoneCraft Android APK
on:
  push:
    branches: [phonecraft-android-host]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build PhoneCraft debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PhoneCraft-Host-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCraft-Host-APK
          path: PhoneCraft-Host-debug.apk
          retention-days: 30
