// Event delegation means click/touch controls work after repainting windows.
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;let a=btn.dataset.action,id=btn.dataset.app;switch(a){
case 'open':openApp(id);break;case 'start':togglePanel('start-menu');break;case 'search':{const show=togglePanel('start-menu');if(show)$('#start-search').focus();break}
case 'taskview':showTaskView();break;case 'taskview-open':$('#taskview-overlay')?.remove();taskClick(id);break;
case 'close':closeWin(id);break;case 'min':minWin(id);break;case 'max':maxWin(id);break;case 'task':taskClick(id);break;
case 'desktop':windows.forEach(w=>{w.minimized=true;w.el.classList.add('minimized')});focused=null;closePopups();renderTaskbar();break;
case 'calendar':renderCalendar();togglePanel('calendar-panel');break;case 'action-center':renderActionCenter();togglePanel('action-panel');break;case 'power':togglePanel('power-panel');break;
case 'exit':if(window.AndroidBridge?.exitSimulator)window.AndroidBridge.exitSimulator();else showToast('Close the browser tab to exit');break;
case 'restart':restart();break;case 'lock':lock();break;case 'unlock':$('#lock-screen')?.remove();locked=false;break;
case 'explorer-path':enterPath(btn.dataset.path);break;case 'explorer-back':enterPath('This PC');break;
case 'file-open':fileOpen(btn.dataset.file);break;case 'new-folder':addFile('folder');break;case 'new-file':addFile('file');break;
case 'note-new':selectedNote=null;noteDraft='';persist('draft',noteDraft);renderApp('notepad');break;case 'note-save':saveNoteAsFile();break;
case 'calc':calcKey(btn.dataset.key);break;case 'browse':browse($('#web-address')?.value);break;case 'web-link':browse(btn.dataset.url);break;
case 'accent':accent=btn.dataset.value;persist('accent',accent);document.documentElement.style.setProperty('--accent',accent);renderApp('settings');break;
case 'wallpaper':wallpaper=btn.dataset.value;persist('wallpaper',wallpaper);$('#desktop').className='desktop wallpaper-'+wallpaper;renderApp('settings');break;
case 'paint-color':paintColor=btn.dataset.value;$$('.paint-color').forEach(x=>x.classList.toggle('selected',x.dataset.value===paintColor));break;
case 'paint-clear':savedDrawing=null;setupPaint();break;case 'paint-save':{const board=$('#paint-board');if(board){const a=document.createElement('a');a.href=board.toDataURL('image/png');a.download='painting.png';a.click();showToast('Image download requested')}break}
case 'restore':{let idx=trash.findIndex(f=>f.id===btn.dataset.file);if(idx>=0){files.push(trash.splice(idx,1)[0]);persist('files',files);persist('trash',trash);renderApp('recycle');showToast('File restored')}break}
case 'empty-trash':if(confirm('Permanently delete all recycled items?')){trash=[];persist('trash',trash);renderApp('recycle')}break;
}});
document.addEventListener('input',e=>{if(e.target.id==='start-search')renderStart(e.target.value);if(e.target.id==='note-text')handleNote(e.target.value)});
document.addEventListener('keydown',e=>{if(e.target.id==='web-address'&&e.key==='Enter')browse(e.target.value);if(e.key==='Escape')window.androidBack()});
// Titlebar dragging supports mouse, pen and touch; control buttons never initiate drag.
let drag=null;
document.addEventListener('pointerdown',e=>{const tb=e.target.closest('.titlebar');if(!tb||e.target.closest('.window-controls'))return;const id=tb.dataset.drag,w=windows.get(id);if(!w||w.maximized)return;focusWin(id);drag={id,startX:e.clientX,startY:e.clientY,left:parseFloat(w.el.style.left),top:parseFloat(w.el.style.top),pointerId:e.pointerId};tb.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;const w=windows.get(drag.id);if(!w)return;const v=viewport();w.el.style.left=Math.min(Math.max(drag.left+e.clientX-drag.startX,0),Math.max(0,v.w-w.el.offsetWidth))+'px';w.el.style.top=Math.min(Math.max(drag.top+e.clientY-drag.startY,0),Math.max(0,v.h-w.el.offsetHeight))+'px'});
document.addEventListener('pointerup',()=>drag=null);document.addEventListener('pointercancel',()=>drag=null);
document.addEventListener('pointerdown',e=>{const w=e.target.closest('.window');if(w)focusWin(w.dataset.win);else if(!e.target.closest('.start-menu,.taskbar,.calendar-panel,.action-panel,.power-panel,.taskview-overlay'))closePopups()},true);
window.addEventListener('resize',()=>{let v=viewport();windows.forEach(w=>{if(w.maximized)return;w.el.style.width=Math.min(w.el.offsetWidth,v.w)+'px';w.el.style.height=Math.min(w.el.offsetHeight,v.h)+'px';w.el.style.left=Math.min(parseFloat(w.el.style.left),Math.max(0,v.w-w.el.offsetWidth))+'px';w.el.style.top=Math.min(parseFloat(w.el.style.top),Math.max(0,v.h-w.el.offsetHeight))+'px'})});
window.androidBack=()=>{if($('#lock-screen')){$('#lock-screen').remove();locked=false;return true}if(['start-menu','calendar-panel','action-panel','power-panel','taskview-overlay'].some(id=>$('#'+id)&&!$('#'+id).classList.contains('hidden'))){closePopups();$('#taskview-overlay')?.remove();return true}if(focused){closeWin(focused);return true}return false};
// Delete virtual files via a long press in File Explorer (also works with right-click).
let longTimer=null, longFile=null;
document.addEventListener('pointerdown',e=>{const f=e.target.closest('.file-item');if(!f||f.dataset.file.startsWith('builtin:'))return;longFile=f.dataset.file;clearTimeout(longTimer);longTimer=setTimeout(()=>{if(longFile){deleteVirtual(longFile);longFile=null}},800)});
['pointerup','pointercancel','pointermove'].forEach(type=>document.addEventListener(type,()=>{clearTimeout(longTimer);longFile=null}));
document.addEventListener('contextmenu',e=>{const f=e.target.closest('.file-item');if(!f||f.dataset.file.startsWith('builtin:'))return;e.preventDefault();deleteVirtual(f.dataset.file)});
function deleteVirtual(id){let item=files.find(f=>f.id===id);if(!item)return;if(!confirm('Move '+item.name+' to Recycle Bin?'))return;files=files.filter(f=>f.id!==id);trash.push(item);persist('files',files);persist('trash',trash);if(selectedNote===id){selectedNote=null;if(windows.has('notepad'))renderApp('notepad')}renderApp('explorer');showToast('Moved to Recycle Bin')}
init();

</script>
</body></html>
